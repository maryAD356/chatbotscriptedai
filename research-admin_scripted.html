<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Session Administration — Workplace Conversation Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0D2D52;
    --navy-deep:#081D38;
    --red:#C8102E;
    --red-deep:#9E0C24;
    --gold:#F9A826;
    --bg:#F7F7F5;
    --panel:#FFFFFF;
    --text:#212121;
    --text-soft:#5C5F63;
    --line:#D8D9D6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:Arial, Helvetica, sans-serif;min-height:100vh;font-size:14px;}
  h1,h2,h3{font-family:'Merriweather', Georgia, serif;margin:0;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px;background:var(--navy);border-bottom:3px solid var(--gold);
  }
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .mark{width:11px;height:11px;background:var(--gold);display:inline-block;}
  .brand h1{font-size:16.5px;color:#fff;font-weight:700;}
  .brand .sub{font-size:11px;color:#B9C4D1;font-family:Arial,sans-serif;letter-spacing:0.02em;}

  .gate{max-width:380px;margin:100px auto;padding:0 20px;}
  .gate-card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:4px;padding:32px 30px;}
  .gate-card h2{font-size:19px;color:var(--navy);margin-bottom:6px;}
  .gate-card p{color:var(--text-soft);font-size:13px;margin:0 0 20px 0;line-height:1.5;}
  .gate input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:4px;
    font-family:'Courier New',monospace;font-size:14px;margin-bottom:12px;
  }
  .gate input:focus{outline:2px solid var(--navy);outline-offset:1px;}
  .gate button{
    width:100%;padding:11px;background:var(--navy);color:#fff;border:none;
    border-radius:4px;font-weight:bold;font-size:13.5px;cursor:pointer;
  }
  .gate button:hover{background:var(--navy-deep);}
  .gate button:disabled{opacity:0.6;cursor:not-allowed;}
  .gate .warn{
    font-size:11.5px;color:var(--text-soft);margin-top:16px;line-height:1.5;
    background:#F1F1EE;border:1px solid var(--line);border-radius:4px;padding:10px 12px;
  }
  .gate-error{color:var(--red);font-weight:bold;font-size:12.5px;margin-top:-4px;margin-bottom:10px;display:none;}

  .layout{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 55px);}
  .sidebar{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;}
  .sidebar-header{padding:16px 18px 13px 18px;border-bottom:1px solid var(--line);background:#FAFAF8;}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:12px;border-radius:4px;overflow:hidden;}
  .stat-box{background:var(--panel);padding:8px 6px;text-align:center;}
  .stat-box .num{font-family:'Merriweather',serif;font-size:19px;font-weight:700;color:var(--navy);display:block;}
  .stat-box.dropped .num{color:var(--red);}
  .stat-box .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-soft);}
  .search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-family:'Courier New',monospace;}
  .search:focus{outline:2px solid var(--navy);outline-offset:1px;}
  .actions-row{display:flex;gap:8px;margin-top:10px;}
  .actions-row button{
    flex:1;background:var(--panel);border:1px solid var(--navy);color:var(--navy);
    padding:8px;border-radius:4px;font-size:11.5px;font-weight:bold;cursor:pointer;
  }
  .actions-row button:hover{background:var(--navy);color:#fff;}

  .session-list{flex:1;overflow-y:auto;}
  .list-head{
    display:grid;grid-template-columns:1fr auto;padding:8px 18px;
    font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-soft);
    border-bottom:1px solid var(--line);background:#FAFAF8;font-weight:bold;
  }
  .session-row{
    padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer;
    display:flex;flex-direction:column;gap:3px;
  }
  .session-row:hover{background:#F1F1EE;}
  .session-row.selected{background:#EAF0F8;border-left:3px solid var(--navy);padding-left:15px;}
  .row-top{display:flex;justify-content:space-between;align-items:center;}
  .row-pid{font-family:'Courier New',monospace;font-size:12.5px;font-weight:bold;color:var(--text);}
  .badge{
    font-size:9.5px;font-family:Arial,sans-serif;letter-spacing:0.03em;text-transform:uppercase;
    padding:2px 7px;border-radius:3px;font-weight:bold;border:1px solid transparent;
  }
  .badge.completed{background:#E7EFE8;color:#1E6B33;border-color:#C6DCC9;}
  .badge.active{background:#EAF0F8;color:var(--navy);border-color:#C7D6E8;}
  .badge.dropped{background:#FBE4E7;color:var(--red-deep);border-color:#F1BFC6;}
  .row-meta{font-size:11px;color:var(--text-soft);}

  .detail{overflow-y:auto;padding:24px 32px;}
  .empty-state{color:var(--text-soft);text-align:center;margin-top:120px;font-size:13.5px;}
  .detail-header{
    display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;
    padding-bottom:14px;border-bottom:2px solid var(--navy);
  }
  .detail-header h2{font-family:'Courier New',monospace;font-size:19px;color:var(--navy);margin:0 0 8px 0;}
  .detail-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-soft);}
  .detail-meta span b{color:var(--text);}
  .export-btn{
    background:var(--gold);color:var(--navy-deep);border:none;padding:9px 16px;
    border-radius:4px;font-size:12px;font-weight:bold;cursor:pointer;
  }
  .export-btn:hover{background:#E89812;}

  .transcript{display:flex;flex-direction:column;gap:11px;}
  .t-msg{max-width:76%;padding:11px 14px;border-radius:4px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
  .t-msg.user{align-self:flex-end;background:#EAF0F8;border:1px solid #CFDCEB;}
  .t-msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);}
  .t-role{font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;font-weight:bold;color:var(--text-soft);display:block;margin-bottom:5px;}
  .t-time{font-family:'Courier New',monospace;font-size:9px;color:var(--text-soft);opacity:0.75;display:block;margin-top:5px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <div><h1>Session Administration</h1><div class="sub">Workplace Conversation Study</div></div>
  </div>
</div>

<div id="app"></div>

<script>
/* ============================================================
   RESEARCHER SETUP — set to your deployed Worker URL.
   The passphrase is checked server-side by the Worker, not here.
   ============================================================ */
const WORKER_URL = "https://chatbotscripted.maryadelua35.workers.dev";
const STALE_MINUTES = 20;
/* ============================================================ */

let adminPass = null;
let sessions = [];
let selectedPid = null;
let searchTerm = "";

function fmtDate(iso){
  if(!iso) return "—";
  return new Date(iso).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
}
function minutesSince(iso){ if(!iso) return Infinity; return (Date.now() - new Date(iso).getTime()) / 60000; }
function computeStatus(s){
  if(s.status === "completed") return "completed";
  if(minutesSince(s.last_activity) > STALE_MINUTES) return "dropped";
  return "active";
}
function statusLabel(st){ return st === "completed" ? "Completed" : st === "dropped" ? "Dropped off" : "Active"; }

async function fetchSessions(){
  const r = await fetch(WORKER_URL + "/api/admin/sessions", { headers: { "X-Admin-Pass": adminPass } });
  if(r.status === 401) throw new Error("unauthorized");
  if(!r.ok) throw new Error("Request failed: " + r.status);
  return r.json();
}

function renderGate(errorMsg){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="gate">
      <div class="gate-card">
        <h2>Researcher Access</h2>
        <p>Enter the study passphrase to view participant sessions.</p>
        <input type="password" id="passInput" placeholder="Passphrase" />
        <div class="gate-error" style="${errorMsg?'display:block;':''}">${errorMsg||''}</div>
        <button id="unlockBtn">Unlock</button>
        <div class="warn"><b>Note:</b> the passphrase is verified on the server, not in this file — this page is safe to host publicly, but share the link only with your research team.</div>
      </div>
    </div>
  `;
 const tryUnlock = async ()=>{
  const pass = input.value.trim();
  if(!pass){
    renderGate("Please enter the passphrase.");
    return;
  }
  btn.disabled = true; btn.textContent = "Checking...";
  adminPass = pass;
  try{ sessions = await fetchSessions(); renderMain(); }
  catch(e){ renderGate(e.message === "unauthorized" ? "That passphrase doesn't match. Try again." : "Couldn't reach the study server."); }
};
  btn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });
  input.focus();
}

function renderMain(){
  const app = document.getElementById("app");
  const filtered = sessions.filter(s => s.pid.toLowerCase().includes(searchTerm.toLowerCase()));
  const completedCount = sessions.filter(s=>computeStatus(s)==="completed").length;
  const droppedCount = sessions.filter(s=>computeStatus(s)==="dropped").length;
  const activeCount = sessions.filter(s=>computeStatus(s)==="active").length;

  app.innerHTML = `
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="stats-row">
            <div class="stat-box"><span class="num">${sessions.length}</span><span class="lbl">Total</span></div>
            <div class="stat-box"><span class="num">${completedCount}</span><span class="lbl">Complete</span></div>
            <div class="stat-box"><span class="num">${activeCount}</span><span class="lbl">Active</span></div>
            <div class="stat-box dropped"><span class="num">${droppedCount}</span><span class="lbl">Dropped</span></div>
          </div>
          <input class="search" id="searchInput" placeholder="Filter by session code..." value="${searchTerm}" />
          <div class="actions-row">
            <button id="refreshBtn">Refresh</button>
            <button id="exportAllBtn">Export All (CSV)</button>
          </div>
        </div>
        <div class="list-head"><span>Session</span><span>Status</span></div>
        <div class="session-list" id="sessionList"></div>
      </div>
      <div class="detail" id="detail"></div>
    </div>
  `;

  const list = document.getElementById("sessionList");
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state" style="margin-top:60px;">No sessions recorded yet.</div>`;
  }
  filtered.forEach(s=>{
    const st = computeStatus(s);
    const row = document.createElement("div");
    row.className = "session-row" + (s.pid === selectedPid ? " selected" : "");
    row.innerHTML = `
      <div class="row-top"><span class="row-pid">${s.pid}</span><span class="badge ${st}">${statusLabel(st)}</span></div>
      <div class="row-meta">${s.messages.length} messages · started ${fmtDate(s.started_at)}</div>
    `;
    row.addEventListener("click", ()=>{ selectedPid = s.pid; renderMain(); });
    list.appendChild(row);
  });

  document.getElementById("searchInput").addEventListener("input", e=>{ searchTerm = e.target.value; renderMain(); });
  document.getElementById("refreshBtn").addEventListener("click", async ()=>{
    try{ sessions = await fetchSessions(); renderMain(); }catch(e){ console.error(e); }
  });
  document.getElementById("exportAllBtn").addEventListener("click", exportAllCsv);

  renderDetail();
}

function renderDetail(){
  const detail = document.getElementById("detail");
  const s = sessions.find(x=>x.pid === selectedPid);
  if(!s){ detail.innerHTML = `<div class="empty-state">Select a session on the left to view its transcript.</div>`; return; }
  const st = computeStatus(s);
  detail.innerHTML = `
    <div class="detail-header">
      <div>
        <h2>${s.pid}</h2>
        <div class="detail-meta">
          <span><b>${statusLabel(st)}</b></span>
          <span>Started: <b>${fmtDate(s.started_at)}</b></span>
          <span>Last activity: <b>${fmtDate(s.last_activity)}</b></span>
          <span>Ended: <b>${fmtDate(s.ended_at)}</b></span>
          <span>${s.messages.length} messages</span>
        </div>
      </div>
      <button class="export-btn" id="exportOneBtn">Export Session</button>
    </div>
    <div class="transcript" id="transcript"></div>
  `;
  const t = document.getElementById("transcript");
  s.messages.forEach(m=>{
    const div = document.createElement("div");
    div.className = "t-msg " + (m.role === "user" ? "user" : "assistant");
    div.innerHTML = `<span class="t-role">${m.role === "user" ? "Participant" : "Assistant"}</span>${escapeHtml(m.content)}<span class="t-time">${fmtDate(m.ts)}</span>`;
    t.appendChild(div);
  });
  document.getElementById("exportOneBtn").addEventListener("click", ()=>exportSessionJson(s));
}

function escapeHtml(str){ const d=document.createElement("div"); d.innerText=str; return d.innerHTML; }

function downloadBlob(content, filename, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function csvEscape(v){ const s=String(v??""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function exportAllCsv(){
  const rows = [["pid","status","turn_index","role","content","timestamp"]];
  sessions.forEach(s=>{
    const st = computeStatus(s);
    s.messages.forEach((m,i)=>{ rows.push([s.pid, st, i, m.role, m.content, m.ts]); });
  });
  downloadBlob(rows.map(r=>r.map(csvEscape).join(",")).join("\n"), "all_sessions_" + Date.now() + ".csv", "text/csv");
}
function exportSessionJson(s){ downloadBlob(JSON.stringify(s, null, 2), s.pid + ".json", "application/json"); }

renderGate();
</script>
</body>
</html>
